services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mailgenius
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/mailgenius
      SECRET_KEY: dev-secret-key-change-in-production
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_KEY: ""
    depends_on:
      - db
      - redis

  celery-worker:
    build: .
    command: celery -A app.worker.celery_app worker -l info -Q send,track,report,default,dead_letter -c 4
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/mailgenius
      SECRET_KEY: dev-secret-key-change-in-production
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_KEY: ""
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    command: celery -A app.worker.celery_app beat -l info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/mailgenius
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  flower:
    image: mher/flower
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - redis

volumes:
  pgdata:
  redisdata:
